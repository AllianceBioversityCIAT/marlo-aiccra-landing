name: Trigger Jenkins EC2 Job

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-job:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Jenkins EC2 pipeline
        run: |
          JENKINS_URL="https://automation.prms.cgiar.org/job/marlo-landing-page-main/build"
          echo "Triggering: ${JENKINS_URL}"
          curl -X POST "${JENKINS_URL}" --user "${JENKINS_USERNAME}:${JENKINS_API_TOKEN}"

        env:
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
